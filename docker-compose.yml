services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartcommute-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:////app/backend/smartcommute.db
      # 在 .env 或部署环境填入真实密钥；缺省时自动使用 Mock 模式
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ONEMAP_TOKEN=${ONEMAP_TOKEN:-}
      - ONEMAP_ROUTING_ENDPOINT=${ONEMAP_ROUTING_ENDPOINT:-https://www.onemap.gov.sg/api/public/routingsvc/route}
      - LTA_ACCOUNT_KEY=${LTA_ACCOUNT_KEY:-}
      - LTA_DATAMALL_BASE_URL=${LTA_DATAMALL_BASE_URL:-https://datamall.lta.gov.sg}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - WEATHER_PROVIDER=${WEATHER_PROVIDER:-open_meteo}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:80}
    volumes:
      - smartcommute-data:/app/backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: smartcommute-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  smartcommute-data:
