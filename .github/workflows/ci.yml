name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: pip install -r backend/requirements.txt

      # 测试在 tests/conftest.py 中强制使用 Mock 数据源与独立测试数据库，
      # 因此 CI 不需要配置任何 API Key，也不会访问外网。
      - name: 运行测试
        run: pytest -q

  frontend:
    name: 前端构建 (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查与构建
        working-directory: frontend
        run: npm run build
